name: Free tennis data and model refresh
on:
  schedule:
    - cron: '30 5 * * *' # 13:30 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tennis-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: tennis-history-v1-${{ github.run_id }}
          restore-keys: tennis-history-v1-
      - run: pip install -r requirements.txt
      - name: Restore verified completion history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern completion-checkpoint.json.gz --dir data --clobber
      - run: python refresh_completion.py
      - run: python refresh.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-model-${{ github.run_id }}
          path: |
            models/current.json
            models/score-config.json
            models/count-config.json
            models/completion.json
            reports/
            data/source-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish verified production model bundle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python production_models.py --build /tmp/tennis-release
          gh release create "model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Daily tennis model ${GITHUB_RUN_ID}" \
            --notes "Free-source ATP/WTA model bundle. Full tests and model/configuration checks passed. Research probabilities; contract_ready=false." \
            /tmp/tennis-release/tennis-model.tar.gz \
            /tmp/tennis-release/tennis-model.sha256 \
            /tmp/tennis-release/completion-checkpoint.json.gz
