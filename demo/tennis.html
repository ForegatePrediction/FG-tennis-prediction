<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foregate · Tennis AI Demo</title>
<style>
:root{--orange:#ff5222;--txt:#24282e;--sub:#737b87;--line:#e5e7eb;--chip:#f8f9fb}*{box-sizing:border-box}body{margin:0;background:#fafafa;color:var(--txt);font:15px system-ui,sans-serif}header,main{max-width:900px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:21px;font-weight:850;color:var(--orange)}select,button{font:inherit;cursor:pointer}select{padding:8px;border:1px solid var(--line);border-radius:8px;background:white}.demo-note{padding:12px 16px;border:1px solid #ffc6b7;border-radius:10px;background:#fff5f1;font-size:13px;line-height:1.7}.match{padding:25px 0}.match h1{font-size:26px;margin-bottom:8px}.muted{color:var(--sub);font-size:13px}.market{padding:20px;margin-bottom:14px;background:white;border:1px solid var(--line);border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.market-title{font-weight:750}.market select{margin-left:8px}.ai-badge{display:none;border:0;border-radius:12px;background:var(--orange);color:white;font-weight:800;font-size:12px;padding:4px 10px;margin-left:9px}body.wb-on .ai-badge{display:inline-flex}#wb-fab{position:fixed;right:26px;bottom:30px;width:66px;height:66px;background:var(--orange);color:white;border:0;border-radius:18px;font-weight:800;box-shadow:0 8px 30px #ff52223d;touch-action:none;z-index:10}#wb-fab:not(.on){background:#9ca3af}#mask{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:18px}#mask.show{display:flex}#sheet{background:white;width:min(540px,100%);max-height:85vh;overflow:auto;border-radius:20px;padding:24px;box-shadow:0 20px 80px #0003}.wb-head{font-size:19px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:18px}.wb-x{border:0;background:none;font-size:24px;color:var(--sub)}.wb-sub{color:var(--sub);font-size:13px;margin-bottom:20px}.wb-row{display:grid;grid-template-columns:minmax(100px,1fr) 1fr 54px;gap:12px;align-items:center;margin:18px 0}.wb-name{font-size:14px}.wb-bar{height:9px;background:#f1f2f4;border-radius:8px;overflow:hidden}.wb-bar i{display:block;height:100%;background:#c7ccd4}.wb-bar.win i{background:var(--orange)}.wb-pct{text-align:right;font-weight:750}.wb-pick{padding:14px;background:#fff4ee;border-radius:10px;margin:20px 0}.wb-reasons{font-size:13px;line-height:1.8}.wb-warn{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;color:var(--sub)}.primary{background:var(--orange);color:white;border:0;border-radius:9px;padding:10px 18px}.loading{padding:35px;text-align:center}.empty{text-align:center;padding:30px 0}.toolbar{display:flex;gap:10px;align-items:center}
</style></head>
<body class="wb-on"><header><span class="brand">Foregate · Tennis</span><div class="toolbar"><select id="tour" aria-label="Tour"><option value="atp">ATP</option><option value="wta">WTA</option></select><select id="lang" aria-label="Language"><option value="zh">繁中</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select><button id="intro" class="primary">AI</button></div></header>
<main><div id="demo-note" class="demo-note"></div><section class="match"><h1 id="match-title"></h1><div id="match-meta" class="muted"></div></section><div id="markets"></div></main>
<button id="wb-fab" class="on" aria-label="AI prediction">✨ AI</button><div id="mask"><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section></div>
<script src="/demo.js"></script></body></html>
